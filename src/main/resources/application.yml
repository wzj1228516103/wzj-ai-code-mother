spring:
  application:
    name: wzj-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
    redis:
      namespace: wzj-ai-code-mother:session
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://8.148.195.220:3306/yu_ai_code_mother
    username: yu_ai
    password: F6846JxDMsYHFShC
  # redis
  data:
    redis:
      host: 8.148.195.220
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:your_redis_password}
      ttl: 3600 # 缓存过期时间（秒）
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wuzijie.wzjaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key}
      model-name: deepseek-chat
#      strict-json-schema: true
#      response-format: json_object
      max-tokens: 8192
      log-requests: true
      log-responses: true
      max-retries: 3
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key}
      model-name: deepseek-reasoner
      max-tokens: 8192
      temperature: 0.7
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:your_dashscope_api_key}
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: true
      log-responses: true
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: https://wuzijie-ai-1325678334.cos.ap-guangzhou.myqcloud.com
    secretId: ${COS_SECRET_ID:your_cos_secret_id}
    secretKey: ${COS_SECRET_KEY:your_cos_secret_key}
    region: ap-guangzhou
    bucket: wuzijie-ai-1325678334
# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY:your_pexels_api_key}
# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:your_dashscope_api_key}
  image-model: wan2.2-t2i-flash
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always